version: '3.7'

services:
    app:
        build: ./docker/php
        container_name: eta_app
        volumes:
            - .:/var/www
        networks:
            - mynetwork
        restart: unless-stopped

    nginx:
        build: ./docker/nginx
        container_name: eta_nginx
        ports:
            - 8080:80
        volumes:
            - ./:/var/www
            - ./docker/nginx/log/:/var/log/nginx
        depends_on:
            - app
        networks:
            - mynetwork
        restart: unless-stopped

    rabbitmq:
        image: rabbitmq:4.0.4-management-alpine
        container_name: eta_rabbitmq
        ports:
            - 5672:5672
            - 15672:15672
        depends_on:
            - app
        environment:
            RABBITMQ_DEFAULT_USER: 'admin'
            RABBITMQ_DEFAULT_PASS: '123456'
            RABBITMQ_DEFAULT_VHOST: 'eta_vhost'
        volumes:
            - ./docker/data/rabbitmq:/var/lib/rabbitmq/
            - ./docker/rabbitmq/log:/var/log/rabbitmq
        networks:
            - mynetwork
        restart: unless-stopped

networks:
  mynetwork:
    driver: bridge
