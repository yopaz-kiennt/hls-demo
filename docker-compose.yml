version: '3.7'

services:
    app:
        build: ./docker/php
        container_name: eta_app
        volumes:
            - .:/var/www
        depends_on:
            - mysql
        networks:
            - mynetwork
        restart: unless-stopped

    nginx:
        build: ./docker/nginx
        container_name: eta_nginx
        ports:
            - 8080:80
        volumes:
            - ./:/var/www
            - ./docker/nginx/log/:/var/log/nginx
        depends_on:
            - app
        networks:
            - mynetwork
        restart: unless-stopped

    mysql:
        image: mysql:8.0
        container_name: eta_mysql
        environment:
            MYSQL_DATABASE: 'hajimaripartner_eta'
            MYSQL_ROOT_PASSWORD: '123456'
        volumes:
            - ./docker/data/db:/var/lib/mysql
        ports:
            - 3305:3306
        networks:
            - mynetwork
        restart: unless-stopped

    vite:
        image: node:20-alpine
        container_name: eta_vite
        working_dir: /var/www
        ports:
            - 5173:5173
        depends_on:
            - app
        volumes:
            - ./:/var/www
        command: sh -c "npm install -g pnpm && pnpm install && pnpm run dev"
        networks:
            - mynetwork
        restart: unless-stopped

    rabbitmq:
        build:
            context: ./docker/rabbitmq
            dockerfile: Dockerfile
        container_name: eta_rabbitmq
        ports:
            - 5672:5672
            - 15672:15672
        depends_on:
            - app
        environment:
            RABBITMQ_DEFAULT_USER: 'admin'
            RABBITMQ_DEFAULT_PASS: '123456'
        volumes:
            - ./docker/data/rabbitmq:/var/lib/rabbitmq/
            - ./docker/rabbitmq/log:/var/log/rabbitmq
        networks:
            - mynetwork
        restart: unless-stopped

networks:
  mynetwork:
    driver: bridge
